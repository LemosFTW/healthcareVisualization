[project]
name = "healthcareVisualization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.8.0",
    "google-generativeai>=0.8.6",
    "healthcare-sdk==0.2.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
markers = [
    "p0: critical — must pass before any merge",
    "p1: high priority",
    "p2: medium priority",
    "p3: low priority / nice to have",
]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
]
